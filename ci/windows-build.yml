name: Windows Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app image
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain createDistributable

      - name: Package app image as zip
        shell: pwsh
        run: |
          $dist = Get-ChildItem -Path build\compose\binaries -Recurse -Directory |
                  Where-Object { $_.Name -eq 'app' } |
                  Select-Object -First 1
          if (-not $dist) { throw 'createDistributable 没有产出 app 目录' }
          New-Item -ItemType Directory -Force -Path build\out | Out-Null
          Compress-Archive -Path "$($dist.FullName)\*" -DestinationPath build\out\NeriPlayer-windows-portable.zip -Force
          Get-Item build\out\NeriPlayer-windows-portable.zip | Select-Object Name, Length

      # MSI 需要 WiX Toolset v3（candle.exe / light.exe）。runner 上不一定有，
      # 所以这一步失败不算整体失败 —— 便携版 zip 已经能跑起来了。
      - name: Package MSI
        continue-on-error: true
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain packageMsi

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: NeriPlayer-windows-portable
          path: build/out/NeriPlayer-windows-portable.zip
          if-no-files-found: error

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: NeriPlayer-windows-msi
          path: build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn
